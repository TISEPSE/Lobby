[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset : le webview doit pouvoir afficher les jaquettes téléchargées.
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# Requêtes HTTP côté natif : les points d'entrée publics de Steam ne renvoient
# pas d'en-tête CORS, le webview ne peut donc pas les appeler lui-même.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# Lecture du registre Windows : la seule source qui connaisse les jeux installés
# hors launcher (Riot, Battle.net, installeurs classiques).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# DPAPI (coffre de Windows) : les secrets gardés sur le disque (session Epic)
# ne sont lisibles que par ce compte Windows, sur ce PC. Déjà tiré par Tauri.
# Fenêtre au premier plan (écran de lancement : le jeu a-t-il ouvert sa fenêtre ?).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
] }
