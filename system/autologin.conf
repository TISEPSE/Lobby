# Autologin sur tty1, variante « sans systemd dédié » : le compte ouvre une
# session et son profil lance l'interface (voir README).
#
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
#   sudo cp autologin.conf /etc/systemd/system/getty@tty1.service.d/
#   sudo systemctl daemon-reload

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin joueur --noclear %I $TERM
