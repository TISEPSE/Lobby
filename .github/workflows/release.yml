# Publie Lobby pour Windows et Linux.
#
# Pousser un tag « v0.2.0 » compile les deux installeurs et les dépose dans une
# release GitHub en brouillon, à relire puis publier à la main :
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Le tag fait foi : sa version est écrite dans tauri.conf.json le temps de la
# compilation, il n'y a donc aucun fichier à modifier avant de taguer.
#
# Lancé à la main (onglet Actions → Release → Run workflow), il compile sans
# rien publier : les installeurs sont joints à l'exécution, pour essayer.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Deux tags poussés coup sur coup ne se marchent pas dessus.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          # Ubuntu 22.04 plutôt que la dernière : une AppImage tourne sur les
          # systèmes dont la glibc est au moins celle de la machine de compilation.
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.TAG.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error(`Tag « ${process.env.TAG} » : attendu vX.Y.Z`);
              process.exit(1);
            }
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = version;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
            console.log(`Version ${version}`);
          '

      # Sur un tag : compile et dépose les installeurs dans la release.
      - name: Compiler et publier
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lobby __VERSION__'
          releaseBody: 'Installeurs Windows (setup.exe) et Linux (AppImage, deb) ci-dessous.'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      # À la main : compile seulement, les installeurs restent joints à l'exécution.
      - name: Compiler (essai)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Joindre les installeurs (essai)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: lobby-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
