<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-60329b44-c79f-42a3-8905-d564f393d83d/styles.css">
<script src="_ds/industry-60329b44-c79f-42a3-8905-d564f393d83d/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-900)}</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:var(--space-6);box-sizing:border-box;gap:var(--space-4)">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)">
    <div style="font-family:var(--font-heading);font-size:28px;letter-spacing:0.04em;text-transform:uppercase">Accueil</div>
    <div style="display:flex;align-items:center;gap:var(--space-3);font-size:15px"><span>{{ clock }}</span><span class="tag tag-accent">Manette · {{ battery }} %</span></div>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:150px;gap:var(--space-3)">
    <sc-for list="{{ games }}" as="g" hint-placeholder-count="8">
      <div class="blueprint" style="display:flex;align-items:flex-end;padding:var(--space-3)"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><span style="font-family:var(--font-heading);font-size:20px">{{ g }}</span></div>
    </sc-for>
  </div>
  <div style="display:flex;gap:var(--space-2);align-items:center;font-size:14px;color:var(--color-neutral-700)">
    <span style="display:inline-grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--color-divider);font-family:var(--font-heading);font-size:13px">⌂</span>
    <span>Bouton Home de la manette, ou touche G, pour ouvrir le guide</span>
  </div>

  <div onClick="{{ close }}" style="position:absolute;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent);opacity:{{ dimOpacity }};pointer-events:{{ dimPointer }};transition:opacity .2s"></div>

  <div class="blueprint" style="position:absolute;top:var(--space-4);bottom:var(--space-4);left:var(--space-4);width:min(420px,calc(100% - 2 * var(--space-4)));background:var(--color-bg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:{{ panelTransform }};transition:transform .22s cubic-bezier(.2,.8,.2,1)">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-3) 0">
      <span style="display:inline-grid;place-items:center;height:22px;padding:0 6px;border:1px solid var(--color-divider);font-family:var(--font-heading);font-size:12px">LB</span>
      <div style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-1)">
        <div onClick="{{ tab0.go }}" style="height:52px;display:grid;place-items:center;cursor:pointer;color:{{ tab0.fg }};border-bottom:2px solid {{ tab0.bd }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div onClick="{{ tab1.go }}" style="height:52px;display:grid;place-items:center;cursor:pointer;color:{{ tab1.fg }};border-bottom:2px solid {{ tab1.bd }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.730.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
        <div onClick="{{ tab2.go }}" style="height:52px;display:grid;place-items:center;cursor:pointer;color:{{ tab2.fg }};border-bottom:2px solid {{ tab2.bd }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg>
        </div>
        <div onClick="{{ tab3.go }}" style="height:52px;display:grid;place-items:center;cursor:pointer;color:{{ tab3.fg }};border-bottom:2px solid {{ tab3.bd }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>
        </div>
      </div>
      <span style="display:inline-grid;place-items:center;height:22px;padding:0 6px;border:1px solid var(--color-divider);font-family:var(--font-heading);font-size:12px">RB</span>
    </div>

    <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-3)">
      <div style="width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--color-accent-100);color:var(--color-accent-800);font-family:var(--font-heading);font-size:22px">N7</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-family:var(--font-heading);font-size:24px;line-height:1.1">{{ heading }}</span>
        <span style="font-size:13px;color:var(--color-accent-700)">{{ subheading }}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px"><span>{{ clock }}</span><span class="tag tag-outline">{{ battery }} %</span></div>
    </div>

    <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:0 var(--space-3)">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div onClick="{{ r.pick }}" onMouseEnter="{{ r.hover }}" style="min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:0 var(--space-3);cursor:pointer;background:{{ r.bg }};color:{{ r.fg }};border-top:1px solid var(--color-divider);transition:background .1s">
          <span style="font-size:17px">{{ r.label }}</span>
          <span style="font-size:14px;opacity:0.85">{{ r.value }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:var(--space-4);padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);font-size:14px">
      <div style="display:flex;align-items:center;gap:var(--space-2)"><span style="display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--color-text);border-radius:50%;font-family:var(--font-heading);font-size:13px">A</span><span>Sélectionner</span></div>
      <div style="display:flex;align-items:center;gap:var(--space-2)"><span style="display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--color-text);border-radius:50%;font-family:var(--font-heading);font-size:13px">B</span><span>{{ backLabel }}</span></div>
    </div>
  </div>

  <sc-if value="{{ isOff }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:var(--color-neutral-900);color:var(--color-bg);display:grid;place-items:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-2)">
        <div style="font-family:var(--font-heading);font-size:34px;letter-spacing:0.06em;text-transform:uppercase">{{ offLabel }}</div>
        <div style="font-size:14px;color:var(--color-neutral-300)">Ne débranchez pas la console</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div class="tag tag-accent" style="position:absolute;right:var(--space-6);bottom:var(--space-6);font-size:14px;padding:10px 18px">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;confirmPower&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportement&quot;}}">
class Component extends DCLogic {
  state = { open: this.props.startOpen ?? true, tab: 0, row: 0, mode: 'menu', pending: null, vib: true, toast: '', now: new Date() };
  tabs = ['Profil', 'Paramètres', 'Manette', 'Alimentation'];
  componentDidMount() {
    this.onKey = e => {
      const map = { g: 'home', G: 'home', Home: 'home', q: 'lb', Q: 'lb', e: 'rb', E: 'rb', PageUp: 'lb', PageDown: 'rb', ArrowLeft: 'lb', ArrowRight: 'rb', ArrowUp: 'up', ArrowDown: 'down', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b' };
      const b = map[e.key];
      if (b) { e.preventDefault(); this.press(b); }
    };
    window.addEventListener('keydown', this.onKey);
    this.tick = setInterval(() => this.setState({ now: new Date() }), 15000);
    const prev = {};
    const loop = () => {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) {
        if (!p) continue;
        const b = i => p.buttons[i] && p.buttons[i].pressed;
        const ay = p.axes[1] || 0;
        const now = { a: b(0), b: b(1), lb: b(4) || b(14), rb: b(5) || b(15), up: b(12) || ay < -0.6, down: b(13) || ay > 0.6, home: b(16) || b(9) };
        for (const k in now) { if (now[k] && !prev[k]) this.press(k); prev[k] = now[k]; }
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); clearInterval(this.tick); cancelAnimationFrame(this.raf); clearTimeout(this.t1); clearTimeout(this.t2); }
  list() {
    const s = this.state;
    if (s.mode === 'confirm') {
      const r = s.pending === 'restart';
      return [{ label: r ? 'Redémarrer maintenant' : 'Éteindre maintenant', act: () => this.doPower() }, { label: 'Annuler', act: () => this.setState({ mode: 'menu', row: 0 }) }];
    }
    return [
      [{ label: 'Voir mon profil', act: () => this.open('Profil') }, { label: 'Changer de profil', act: () => this.open('Changement de profil') }, { label: 'Se déconnecter', act: () => this.open('Déconnexion') }],
      [{ label: 'Tous les paramètres', act: () => this.open('Paramètres') }, { label: 'Réseau', value: 'Wi-Fi · 5 GHz', act: () => this.open('Réseau') }, { label: 'Stockage', value: '412 Go libres', act: () => this.open('Stockage') }, { label: 'Système', value: 'À jour', act: () => this.open('Système') }],
      [{ label: 'Batterie', value: '72 %', act: () => {} }, { label: 'Vibrations', value: s.vib ? 'Activées' : 'Désactivées', act: () => this.setState({ vib: !s.vib }) }, { label: 'Déconnecter la manette', act: () => this.open('Manette déconnectée') }],
      [{ label: 'Redémarrer la console', act: () => this.ask('restart') }, { label: 'Éteindre la console', act: () => this.ask('off') }]
    ][s.tab];
  }
  ask(p) { if (this.props.confirmPower ?? true) this.setState({ mode: 'confirm', pending: p, row: 0 }); else this.setState({ pending: p }, () => this.doPower()); }
  open(t) { this.showToast(t); this.setState({ open: false }); }
  press(btn) {
    const s = this.state;
    if (s.mode === 'off') return;
    if (btn === 'home') return this.setState({ open: !s.open, mode: 'menu', row: 0 });
    if (!s.open) return;
    const n = this.list().length;
    if (btn === 'up') this.setState({ row: (s.row + n - 1) % n });
    if (btn === 'down') this.setState({ row: (s.row + 1) % n });
    if (btn === 'a') this.list()[s.row].act();
    if (btn === 'b') s.mode === 'confirm' ? this.setState({ mode: 'menu', row: 0 }) : this.setState({ open: false });
    if ((btn === 'lb' || btn === 'rb') && s.mode === 'menu') this.setState({ tab: (s.tab + (btn === 'rb' ? 1 : 3)) % 4, row: 0 });
  }
  doPower() {
    this.setState({ mode: 'off', open: false });
    this.t1 = setTimeout(() => this.setState({ mode: 'menu', row: 0 }), 2600);
  }
  showToast(t) { clearTimeout(this.t2); this.setState({ toast: t }); this.t2 = setTimeout(() => this.setState({ toast: '' }), 1800); }
  renderVals() {
    const s = this.state;
    const tab = i => ({ fg: s.tab === i ? 'var(--color-accent-700)' : 'var(--color-neutral-600)', bd: s.tab === i ? 'var(--color-accent)' : 'transparent', go: () => s.mode === 'menu' && this.setState({ tab: i, row: 0 }) });
    const rows = this.list().map((r, i) => ({
      label: r.label, value: r.value || '',
      bg: s.row === i ? 'var(--color-accent)' : 'transparent',
      fg: s.row === i ? 'var(--color-bg)' : 'var(--color-text)',
      pick: () => { this.setState({ row: i }); r.act(); },
      hover: () => this.setState({ row: i })
    }));
    const confirm = s.mode === 'confirm';
    const restart = s.pending === 'restart';
    return {
      games: ['Jeu en cours', 'Bibliothèque', 'Boutique', 'Amis', 'Captures', 'Téléchargements', 'Multijoueur', 'Médias'],
      clock: s.now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
      battery: 72,
      tab0: tab(0), tab1: tab(1), tab2: tab(2), tab3: tab(3),
      heading: confirm ? (restart ? 'Redémarrer ?' : 'Éteindre ?') : s.tab === 0 ? 'NOVA_77' : this.tabs[s.tab],
      subheading: confirm ? 'Les données non sauvegardées seront perdues' : s.tab === 0 ? '● En ligne · Niveau 34' : 'NOVA_77 · En ligne',
      rows,
      backLabel: confirm ? 'Retour' : 'Fermer',
      panelTransform: s.open ? 'translateX(0)' : 'translateX(calc(-100% - 40px))',
      dimOpacity: s.open ? 1 : 0, dimPointer: s.open ? 'auto' : 'none',
      close: () => this.setState({ open: false, mode: 'menu' }),
      isOff: s.mode === 'off', offLabel: restart ? 'Redémarrage…' : 'Extinction…',
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
